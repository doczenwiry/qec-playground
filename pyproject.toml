[project]
name = "qec-playground"
description = "a collection of notebooks and stim circuits to study QEC"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "clifft>=0.10.1",
    "ipykernel>=7.3.0",
    "ipython>=9.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "seaborn>=0.13.2",
    "sinter>=1.16.0",
    "stim>=1.16.0",
    "tqec>=0.2.0",
]
